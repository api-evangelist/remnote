aid: remnote
name: Remnote
description: >-
  RemNote is an AI-powered note-taking, spaced-repetition, and PDF-annotation
  study platform founded at MIT and backed by General Catalyst, used by over a
  million students to take notes, generate flashcards, annotate PDFs and slides,
  and study with an integrated spaced-repetition queue and AI tutor. For
  developers, RemNote exposes a first-party front-end Plugin SDK
  (@remnote/plugin-sdk) — a React-first, sandboxed extension platform with a Rem
  API, hooks, widgets, and virtual embeds — rather than a hosted backend REST
  API. Plugins run either sandboxed in an iframe or natively on the main thread,
  with scoped access at the Rem, Document, and Powerup level, and are published
  through an in-app plugin marketplace after a code-review process.
